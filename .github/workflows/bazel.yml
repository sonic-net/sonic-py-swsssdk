name: Bazel

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python3:
    name: Bazel Python (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: AMD64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: ARM64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: bazel-contrib/setup-bazel@f34d6a05eae3c24acab7fa54587492daeaeffdab # 0.19.2
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build Python distribution and installation targets
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          bazel build //:swsssdk //:swsssdk.wheel //:swsssdk.runtime //:swsssdk.runtime_metadata
      - name: Run upstream tests
        run: bazel test //:upstream_tests --test_output=errors
      - name: Verify the proposed checkout through an independent consumer
        working-directory: tests/bazel_consumer
        run: bazel test --override_module=sonic-py-swsssdk=../.. //:distribution_test --test_output=errors
