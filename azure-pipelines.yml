# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  branches:
    include:
    - master
    - 202???

pr:
  branches:
    include:
    - master
    - 202???

variables:
  - name: BUILD_BRANCH
    ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
      value: $(System.PullRequest.TargetBranch)
    ${{ else }}:
      value: $(Build.SourceBranchName)

stages:
- stage: Build
  jobs:
  - job:
    displayName: "build"
    timeoutInMinutes: 60
    variables:
      DIFF_COVER_CHECK_THRESHOLD: 80
      DIFF_COVER_ENABLE: 'true'
    pool:
      vmImage: ubuntu-latest

    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-trixie:$(BUILD_BRANCH)

    steps:
    - checkout: self
      clean: true
      submodules: recursive
      displayName: 'Checkout code'
    - script: |
        set -ex
        sudo mkdir -p /etc/apt/keyrings
        curl -sSL https://packages.microsoft.com/keys/microsoft-2025.asc | sudo gpg --dearmor -o /etc/apt/keyrings/microsoft-prod.gpg
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/13/prod trixie main" | sudo tee /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get update
        sudo apt-get install -y diff-cover dotnet-sdk-8.0
        sudo pip3 install pytest pytest-azurepipelines==1.0.5
        sudo pip3 install pytest-cov
      displayName: "Install build tools"
    - script: |
        set -ex

        python3 setup.py bdist_wheel
        mkdir -p $(Build.ArtifactStagingDirectory)/target/python-wheels
        cp dist/*.whl $(Build.ArtifactStagingDirectory)/target/python-wheels/
      displayName: "Build"
    - script: |
        set -ex

        sudo python3 -m pip install dist/swsssdk-2.0.1-py3-none-any.whl
        python3 -m pytest  --doctest-modules --junitxml=junit/test-results.xml --cov=. --cov-report=xml
      displayName: "Unit tests"
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: sonic-py-swsssdk
      displayName: "Archive artifacts"
    - task: PublishTestResults@2
      inputs:
        testResultsFiles: '**/test-*.xml'
        testRunTitle: Python 3
        failTaskOnFailedTests: true
      condition: succeededOrFailed()
      displayName: 'Publish Python 3 test results'
    - task: PublishCodeCoverageResults@1
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/**/coverage.xml'
        additionalCodeCoverageFiles: '$(System.DefaultWorkingDirectory)/**/*.coverage'
      displayName: 'Publish Python 3 test coverage'
